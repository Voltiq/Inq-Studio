name: Release

# Push a tag like v1.2.3 (matching the version in tauri.conf.json) to publish a release:
# the installer, and the signed update files installed copies check for.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install
        run: npm ci

      - name: Interface tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($version))\b.*?\r?\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md." }
          $notes += "`n`n**Install:** download ``Inq.Studio_${version}_x64-setup.exe`` below and double-click it. Not code-signed yet: if SmartScreen warns, choose *More info › Run anyway*. Installed copies update themselves."
          Add-Content -Path $env:GITHUB_OUTPUT -Value "notes<<END_OF_NOTES"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $notes
          Add-Content -Path $env:GITHUB_OUTPUT -Value "END_OF_NOTES"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Inq Studio ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          # latest.json: what installed copies read to find this version.
          includeUpdaterJson: true

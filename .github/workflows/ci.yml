name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install
        run: npm ci

      - name: Type-check and build the interface
        run: npm run build

      - name: Interface tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build the app (no installer)
        # Proves the whole app compiles in release mode, without signing anything.
        run: npx tauri build --no-bundle

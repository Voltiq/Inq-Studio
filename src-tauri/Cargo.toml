[package]
name = "inq-studio"
version = "1.2.0"
description = "Inq Studio: a professional PDF viewer and editor that writes in the document's own fonts"
license = "MIT"
repository = "https://github.com/Voltiq/Inq-Studio"
authors = ["Voltiq"]
edition = "2021"

[lib]
name = "inq_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# A second start hands its file to the window that is already open
tauri-plugin-single-instance = "2"
# Updates from GitHub Releases, signed
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PDF object model: parse, edit content streams, save
lopdf = "0.47"
# Reading embedded font programs: glyph coverage, cmaps, advance widths
ttf-parser = "0.25"
base64 = "0.22"
# Cutting system fonts down to the glyphs an edit needs before embedding them
subsetter = "0.2"
# Decoding and encoding images for insert, replace, extract and redaction
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Random file keys and identifiers for encryption
getrandom = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
# Finding installed fonts through the Windows font registry
winreg = "0.55"
# OCR (Windows.Media.Ocr) and certificates (CryptoAPI / CNG)
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }
